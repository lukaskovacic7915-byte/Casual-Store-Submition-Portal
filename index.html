<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasualStore Appx Submission Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c2f33; color: white; display: flex; justify-content: center; padding: 40px; }
        .container { background-color: #23272a; padding: 25px; border-radius: 8px; width: 100%; max-width: 460px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #7289da; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 14px; color: #b9bbbe; }
        input[type="text"], input[type="url"], select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: none; background: #2c2f33; color: white; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: flex-start; margin-top: 16px; gap: 10px; background: #2c2f33; padding: 10px; border-radius: 5px; }
        .checkbox-group input { margin-top: 3px; cursor: pointer; }
        .checkbox-group label { margin-top: 0; font-size: 13px; color: #dcddde; cursor: pointer; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #5865F2; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #4752c4; }
    </style>
</head>
<body>

<div class="container">
    <h2>CasualStore Appx Submission Portal</h2>
    <form id="appForm">
        <label>App Name *</label>
        <input type="text" id="appName" required placeholder="e.g. My App">

        <label>URL *</label>
        <input type="url" id="appxLink" required placeholder="https://...">

        <label>Icon URL *</label>
        <input type="url" id="iconLink" required placeholder="https://.../icon.png">

        <label>Publisher *</label>
        <input type="text" id="publisher" required placeholder="e.g. CasualDev">

        <label>Version *</label>
        <input type="text" id="version" required placeholder="e.g. 1.0.2.0">

        <label>Genre *</label>
        <select id="genre" required>
            <option value="Games">Games</option>
            <option value="Productivity">Productivity</option>
            <option value="Utilities & Tools">Utilities & Tools</option>
            <option value="Social & Communication">Social & Communication</option>
            <option value="Multimedia & Entertainment">Multimedia & Entertainment</option>
            <option value="Education">Education</option>
            <option value="Developer Tools">Developer Tools</option>
            <option value="Other">Other</option>
        </select>

        <label>CPU Architecture *</label>
        <select id="cpu" required>
            <option value="x64">x64 (64-bit)</option>
            <option value="x86">x86 (32-bit)</option>
            <option value="ARM64">ARM64</option>
            <option value="ARM">ARM</option>
            <option value="Universal / Neutral">Universal / Neutral</option>
        </select>

        <div class="checkbox-group">
            <input type="checkbox" id="safetyCheck" required>
            <label for="safetyCheck">I confirm that this submission is not an .exe, not an .msi, and does not contain a virus or malware. *</label>
        </div>

        <button type="submit">Submit App</button>
    </form>
</div>

<script>
    const webhookURL = "https://discord.com/api/webhooks/1573681399607726322/EYYbHPow5vC6dDAH9etLFEQhw3wWYf0IAqGwHomFA5m6leGyRh06i3hZ8FouXxXPryNA";

    document.getElementById('appForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const data = {
            username: "CasualStore Bot",
            embeds: [{
                title: "📦 New App Submission!",
                color: 5814783,
                thumbnail: { url: document.getElementById('iconLink').value },
                fields: [
                    { name: "App Name", value: document.getElementById('appName').value, inline: true },
                    { name: "Publisher", value: document.getElementById('publisher').value, inline: true },
                    { name: "Version", value: document.getElementById('version').value, inline: true },
                    { name: "Genre", value: document.getElementById('genre').value, inline: true },
                    { name: "CPU Architecture", value: document.getElementById('cpu').value, inline: true },
                    { name: "Safety Check", value: "✅ Verified (Not .exe/.msi/virus)", inline: true },
                    { name: "URL", value: document.getElementById('appxLink').value, inline: false },
                    { name: "Icon URL", value: document.getElementById('iconLink').value, inline: false }
                ],
                timestamp: new Date()
            }]
        };

        fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(res => {
            if (res.ok) {
                alert("Your app has been submitted successfully!");
                document.getElementById('appForm').reset();
            } else {
                alert("Error submitting app. Please check the Icon URL or Webhook URL.");
            }
        })
        .catch(err => alert("Network error occurred."));
    });
</script>

</body>
</html>
